  <text x="200" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#fed7aa" text-anchor="middle" letter-spacing="1">CNCF OPERATOR CONTRIBUTOR</text>
