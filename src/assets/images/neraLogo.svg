<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="nera-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="nera-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#nera-bg)"/>
  <circle cx="200" cy="85" r="55" fill="rgba(255,255,255,0.06)" />
  <circle cx="200" cy="85" r="42" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="4,4" />
  <!-- Compass Rose & Map Route Icon -->
  <g transform="translate(200, 85)" filter="url(#glow)">
    <polygon points="0,-32 8,-6 32,0 8,6 0,32 -8,6 -32,0 -8,-6" fill="url(#nera-accent)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>
  <!-- Text -->
  <text x="200" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">NERA</text>
  <text x="200" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">SMART LOGISTICS &amp; AI ROUTING</text>
</svg>