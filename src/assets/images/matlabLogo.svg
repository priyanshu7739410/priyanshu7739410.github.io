<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="matlab-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#matlab-bg)"/>
  <circle cx="200" cy="85" r="55" fill="rgba(255,255,255,0.08)" />
  <!-- 3D Wave Mesh Emblem -->
  <g transform="translate(200, 85)">
    <!-- Base Wave Polygon -->
    <path d="M-28,14 C-12,0 0,22 18,6 C24,2 28,14 28,14 L12,24 C-2,20 -18,28 -28,14 Z" fill="#fb923c" opacity="0.8" />
    <!-- Peak Wave -->
    <path d="M-24,-4 C-10,-24 4,2 24,-12 L28,8 C12,18 -8,6 -24,-4 Z" fill="#ffffff" />
    <!-- Contour wireframe lines -->
    <path d="M-20,-10 C-6,-20 8,-2 22,-8" fill="none" stroke="#ea580c" stroke-width="2" />
    <path d="M-22,2 C-8,-6 6,8 24,0" fill="none" stroke="#ea580c" stroke-width="2" />
  </g>
  <text x="200" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">MATLAB ACADEMY</text>
  <text x="200" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#fed7aa" text-anchor="middle" letter-spacing="1">SIMULINK &amp; SIMSCAPE CERTIFIED</text>
</svg>