<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="agent-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31104b" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="agent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#agent-bg)"/>
  <circle cx="200" cy="85" r="55" fill="rgba(236,72,153,0.1)" />
  <!-- Agent Workflow Nodes -->
  <g transform="translate(200, 85)">
    <!-- Central Agent Core -->
    <rect x="-18" y="-18" width="36" height="36" rx="8" fill="url(#agent-glow)" />
    <!-- Pulse lines -->
    <line x1="0" y1="-18" x2="0" y2="-32" stroke="#e879f9" stroke-width="2.5" />
    <circle cx="0" cy="-34" r="5" fill="#f472b6" />
    <line x1="18" y1="0" x2="32" y2="0" stroke="#e879f9" stroke-width="2.5" />
    <circle cx="34" cy="0" r="5" fill="#f472b6" />
    <line x1="-18" y1="0" x2="-32" y2="0" stroke="#e879f9" stroke-width="2.5" />
    <circle cx="-34" cy="0" r="5" fill="#f472b6" />
    <line x1="0" y1="18" x2="0" y2="32" stroke="#e879f9" stroke-width="2.5" />
    <circle cx="0" cy="34" r="5" fill="#f472b6" />
    <!-- Bot eyes -->
    <circle cx="-6" cy="-2" r="3" fill="#ffffff" />
    <circle cx="6" cy="-2" r="3" fill="#ffffff" />
  </g>
  <text x="200" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">AGENTIC OUTREACH</text>
  <text x="200" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#fbcfe8" text-anchor="middle" letter-spacing="1">LANGGRAPH &amp; AZURE WORKFLOWS</text>
</svg>