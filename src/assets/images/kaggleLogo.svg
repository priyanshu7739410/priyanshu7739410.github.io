  <text x="200" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#bae6fd" text-anchor="middle" letter-spacing="1">ML &amp; SQL SPECIALIZATION</text>
