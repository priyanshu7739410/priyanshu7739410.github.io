<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="mc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="mc-cube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow-mc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#mc-bg)"/>
  <circle cx="200" cy="85" r="55" fill="rgba(59,130,246,0.1)" />
  <!-- Isometric Container Cube -->
  <g transform="translate(200, 85)" filter="url(#glow-mc)">
    <!-- Top Face -->
    <polygon points="0,-30 28,-14 0,2 -28,-14" fill="#93c5fd" />
    <!-- Left Face -->
    <polygon points="-28,-14 0,2 0,32 -28,16" fill="#3b82f6" />
    <!-- Right Face -->
    <polygon points="0,2 28,-14 28,16 0,32" fill="#1d4ed8" />
    <!-- Inner cgroups layers -->
    <line x1="-14" y1="-7" x2="-14" y2="23" stroke="#60a5fa" stroke-width="1.5" />
    <line x1="14" y1="-7" x2="14" y2="23" stroke="#2563eb" stroke-width="1.5" />
  </g>
  <text x="200" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">MINICONTAINER</text>
  <text x="200" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#93c5fd" text-anchor="middle" letter-spacing="1">LINUX RUNTIME &amp; OBSERVABILITY</text>
</svg>